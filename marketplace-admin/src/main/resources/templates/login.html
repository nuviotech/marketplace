		    return true;
		}
		 
		function verifyCaptcha(token) {
		    recaptcha_response = token;
		    document.getElementById('g-recaptcha-error').innerHTML = '';
		}
		
		storeCredentials = () =>{
			var email = document.getElementById('exampleInputEmail').value;
			var password = document.getElementById('exampleInputPassword').value;
			document.cookie = "myEmail="+email+";path=localhost:9091";
			document.cookie = "myPass="+password+";path=localhost:9091";
		}
		setCookieData = () => {
			document.getElementById('exampleInputEmail').value=getCookie("myEmail");
			document.getElementById('exampleInputPassword').value=getCookie("myPass");
		}
		
		function getCookie(cname) {
			  let name = cname + "=";
			  let decodedCookie = decodeURIComponent(document.cookie);
			  let ca = decodedCookie.split(';');
			  for(let i = 0; i <ca.length; i++) {
			    let c = ca[i];
			    while (c.charAt(0) == ' ') {
			      c = c.substring(1);
			    }
			    if (c.indexOf(name) == 0) {
			      return c.substring(name.length, c.length);
			    }
			  }
			  return "";
			}
	</script>
