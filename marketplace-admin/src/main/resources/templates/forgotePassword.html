<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author" content="">
<link rel="icon" type="image/x-icon" th:href="@{/webImages/default.png}" />
<title th:text="${title}"></title>


<!-- fontawesome icon -->
<link rel="stylesheet" th:href="@{/webAssets/fonts/fontawesome/css/fontawesome-all.min.css}">
<!-- vendor css -->
<link rel="stylesheet" th:href="@{/webAssets/css/style.css}">


</head>

<body class="bg-gradient-primary" onload="setCookieData()">

	<div class="container">

		<!-- Outer Row -->
		<div class="row justify-content-center">

			<div class="col-xl-10 col-lg-12 col-md-9">

				<div class="card o-hidden border-0 shadow-lg my-5">
					<div class="card-body p-0">
						<!-- Nested Row within Card Body -->

						<div class="row">

							<div class="col-lg-6 d-none d-lg-block text-center ">

								<img class="ml-4 mt-3  img-fluid" th:src="@{/webAssets/images/Tablet.gif}" />
							</div>
							<div class="col-lg-6">
								<div class="p-5">
									<div class="text-center">
										<h1 class="h4 text-gray-900 mb-4"><b>Reset Password</b></h1>
									</div>
									<div id="message"></div>
									<div th:if="${error !=null}"
										class="mb-1 pt-1 pb-0 text-danger">
										<p th:text="${error}"></p>
									</div>
									<div th:if="${success !=null}"
										class="mb-1 pt-1 pb-0 text-success">
										<p th:text="${success}"></p>
									</div>
									<div th:if="${param.verifivationId!=null && param.email!=null}">
										<form th:action="@{/do_resetPassword_1}" onsubmit="return validation()"  method="post">
											<small class="text-muted mt-3">New password</small>
										
											<input class="form-control form-control-user my-1" type="password" id="newPassword" name="newPassword" placeholder="new password"/>
											
											
											<small class="text-muted mt-4">Confirm password</small>
											<input class="form-control form-control-user my-1" type="password" id="confirmPassword" name="confirmPassword" placeholder="confirm password "/>
										
											<input type="hidden" name="code" th:value="${param.verifivationId}"/>
											<input type="hidden" name="token_email" th:value="${param.email}"/>
											<button type="submit"
												class="btn btn-primary btn-user btn-block my-3">change password</button>
										</form>
									</div>
									<div th:if="${param.verifivationId==null}">
										
										<form th:action="@{/do_forgotePassword_1}"  method="post">
											<div class="form-group">
												<input type="email" name="email"
													class="form-control form-control-user"
													id="exampleInputEmail" aria-describedby="emailHelp"
													placeholder="Enter Email Address...">
											</div>
											
											<button type="submit"
												class="btn btn-primary btn-user btn-block">send mail</button>
											<a href="/" type="submit"
												class="btn btn-outline-primary btn-user btn-block">back to login</a>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap core JavaScript-->
	<script src='https://www.google.com/recaptcha/api.js'></script>
	<script src="vendor/jquery/jquery.min.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

	<!-- Core plugin JavaScript-->
	<script src="vendor/jquery-easing/jquery.easing.min.js"></script>

	<!-- Custom scripts for all pages-->
	<script src="js/sb-admin-2.min.js"></script>
	
	<script>
		function validation(){
			
			const np=document.getElementById('newPassword').value;
			const cp=document.getElementById('confirmPassword').value;
			if(np.length===0 || cp.length===0){
				document.getElementById('message').innerHTML="<span class='text-danger'>password is required !!</span>"
			}else if(np==cp){
				return true;
			}else{
				document.getElementById('message').innerHTML="<span class='text-danger'>New password and confirm password not match !!</span>"
				return false;
			}
			return false;
		}
	</script>
</body>

</html>
