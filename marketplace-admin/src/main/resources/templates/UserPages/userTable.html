<html lang="en" xmlns:th="http://www.thymeleaf.org"
   th:replace="UserPages/index::layout(~{::section})">
   <head></head>
   <body>
      <section>
         <div class="pcoded-wrapper">
            <div class="pcoded-content">
               <div class="pcoded-inner-content">
                  <div class="main-body">
                     <div class="page-wrapper">
                        <!-- [ breadcrumb ] start -->
                        <div class="page-header">
                           <div class="page-block">
                              <div class="row align-items-center">
                                 <div class="col-md-12">
                                    <div class="page-header-title">
                                       <h5 class="m-b-10">Buyers</h5>
                                    </div>
                                    <ul class="breadcrumb">
                                       <li class="breadcrumb-item"><a href="index.html"><i class="feather icon-home"></i></a></li>
                                       <li class="breadcrumb-item"><a href="#!">Buyers</a></li>
                                    </ul>
                                 </div>
                              </div>
                           </div>
                        </div>
                        <div class="container-fluid">
                        </div>
                        <div class="card shadow mb-4">
                           <div class="card-body">
                              <div class="table-responsive">
                                 <table class=" table table-bordered" id="dataTable" width="100%"
                                    cellspacing="0">
                                    <thead>
                                       <tr>
                                          <th>#ID</th>
                                          <th>Name</th>
                                          <th>Email</th>
                                          <th>Phone</th>
                                          <th>Creation Date</th>
                                          <th>No. Order</th>
                                       </tr>
                                    </thead>
                                    <tbody>
                                       <tr th:each="user : ${users}">
                                          <td th:text="${user.getUserId()}"></td>
                                          <td th:text="${user.getFirstName()+' '+user.getLastName()}"></td>
                                          <td th:text="${user.getEmail()}"></td>
                                          <td th:text="${user.getPhone()}" ></td>
                                          <td th:text="${user.getCreatedDtTime()}" ></td>
                                          <td th:text="${user.orders.size()}" ></td>
                                       </tr>
                                    </tbody>
                                 </table>
                              </div>
                           </div>
                        </div>
                        <div th:if="${totalPage!=0}" class="my-5">
                           <nav aria-label="Page navigation example ">
                              <ul class="pagination justify-content-end">
                                 <li th:classappend="${ currentPage == 0 ?'disabled':'enabled' }"
                                    class="page-item"><a class="page-link"
                                    th:href="@{'/marketplace/getUsers?page='+${currentPage-1} }"
                                    tabindex="-1">Previous</a></li>
                                 <li th:each="i : ${#numbers.sequence(1,totalPage)}"
                                    class="page-item text-dark"><a class="page-link text-dark"
                                    th:classappend="${ i==currentPage+1 }?'bg-dyellow' : ''"
                                    th:href="@{'/marketplace/getUsers?page='+${i-1} }"><span
                                    th:text="${i}"></span></a></li>
                                 <li class="page-item"
                                    th:classappend="${ currentPage+1 == totalPage } ?'disabled':'enabled' ">
                                    <a class="page-link"
                                       th:href="@{'/marketplace/getUsers?page='+${currentPage+1} }">Next</a>
                                 </li>
                              </ul>
                           </nav>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </section>
   </body>
</html>
