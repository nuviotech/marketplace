<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="UserPages/index::layout(~{::section})">
<head>
</head>
<body>
	<section>
		<div class="container">
			<h4 class="text-center">Marketplace information</h4>
			<div class="row">
				<div th:if="${marketplaceData!=null}" class="col-sm-12 col-md-6 offset-md-3 card py-3 px-2">
					<h5>Marketplace owner : <span class="text-muted" th:text="${marketplaceData.firstName+' '+marketplaceData.lastName}"></span> </h5>
					<h5>Marketplace status : <span class="badge badge-success" th:if="${marketplaceData.isActive==1}">Active</span> <span class="badge badge-danger" th:if="${marketplaceData.isActive==0}">Inactive</span></h5>
					<h5>Marketplace api endpoint : <span class="text-primary"  th:text="${marketplaceData.apiEndPoint}"></span> <a class="btn btn-sm btn-danger" th:href="@{/marketplace/setMarketplaceApiEndpoint}" th:if="${(marketplaceData.apiEndPoint==null || marketplaceData.apiEndPoint.length()<=2)}"><i class="fa-solid fa-arrows-rotate"></i> Get Api Endpoint</a></h5>
					<h5>Contact no : <span class="text-muted" th:text="${marketplaceData.phoneNumber}"></span> </h5>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
