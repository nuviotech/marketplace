<html lang="en" xmlns:th="http://www.thymeleaf.org"
   th:replace="UserPages/index::layout(~{::section})">
   <head></head>
   <body>
      <section>
         <div class="pcoded-wrapper">
            <div class="pcoded-content">
               <div class="pcoded-inner-content">
                  <div class="main-body">
                     <div class="page-wrapper">
                        <!-- [ breadcrumb ] start -->
                        <div class="page-header">
                           <div class="page-block">
                              <div class="row align-items-center">
                                 <div class="col-md-12">
                                    <div class="page-header-title">
                                       <h5 class="m-b-10">Profile</h5>
                                    </div>
                                    <ul class="breadcrumb">
                                       <li class="breadcrumb-item"><a href="index.html"><i class="feather icon-home"></i></a></li>
                                       <li class="breadcrumb-item"><a href="#!">profile</a></li>
                                    </ul>
                                 </div>
                              </div>
                           </div>
                        </div>
                        <!-- [ breadcrumb ] end -->
                        <div class="my-3s">
                           <h4 class="text-center text-primary"><b>Update Profile</b></h4>
                           <div class="row">
                              <div style="" class="card p-3 col-12 col-md-6 offset-md-3">
                                 <div th:if="${updateUserPData}" class="alert alert-success">details updated successfully.</div>
                                 <form th:action="@{/marketplace/saveUserDetails}" method="post" class="form" th:object="${user}">
                                    <div class="mt-3">
                                       <label for="name"><small>Name :</small></label>
                                       <input placeholder="enter name here..." required="required" th:value="${user.name}" type="text" class="form-control" name="name" id="name" />
                                    </div>
                                    <div class="mt-3">
                                       <label for="name"><small>Password :</small></label>
                                       <input placeholder="enter password.." required="required" th:value="${user.password}" type="password" class="form-control" name="password" id="password" />
                                    </div>
                                    <div class="mt-3">
                                       <label for="email"><small>Enter support email id:</small></label>
                                       <input required="required" placeholder="enter support email id" th:value="${user.supportEmailId}" type="email" class="form-control" name="supportEmailId" id="supportEmailId" />
                                    </div>
                                    <div class="mt-3">
                                       <label for="email"><small>Enter support email app password:</small></label>
                                       <input required="required" placeholder="enter support email id" th:value="${user.supportEmailPassword}" type="text" class="form-control" name="supportEmailPassword" id="supportEmailPassword" />
                                    </div>
                                    <div class="text-right mt-2">
                                       <button type="submit" class="btn btn-outline-primary btn-sm">Update details</button>
                                    </div>
                                 </form>
                              </div>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </section>
   </body>
</html>
